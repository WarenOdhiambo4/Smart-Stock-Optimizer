{% extends 'base.html' %}

{% block title %}{{ action }} Logistics - SaasApp{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{{ action }} Logistics</h1>
    <a href="{% url 'logistics_list' %}" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left me-1"></i>{{ content.cms_back_to_list|default:'Back to List' }}</a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="sale" class="form-label">{{ content.cms_related_sale|default:'Related Sale *' }}</label>
                            <select name="sale" id="sale" class="form-select" required>
                                <option value="">{{ content.cms_select_sale|default:'Select Sale' }}</option>
                                {% for sale in sales %}
                                <option value="{{ sale.id }}" {% if logistics and logistics.sale_id == sale.id %}selected{% endif %}>{{ sale.sale_number }} - {{ sale.customer_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="from_branch" class="form-label">{{ content.cms_from_branch|default:'From Branch *' }}</label>
                            <select name="from_branch" id="from_branch" class="form-select" required>
                                <option value="">{{ content.cms_select_branch|default:'Select Branch' }}</option>
                                {% for branch in branches %}
                                <option value="{{ branch.id }}" {% if logistics and logistics.from_branch_id == branch.id %}selected{% endif %}>{{ branch.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="customer_name" class="form-label">{{ content.cms_customer_name|default:'Customer Name *' }}</label>
                            <input type="text" name="customer_name" id="customer_name" class="form-control" required value="{% if logistics %}{{ logistics.customer_name }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label for="customer_phone" class="form-label">{{ content.cms_customer_phone|default:'Customer Phone *' }}</label>
                            <input type="text" name="customer_phone" id="customer_phone" class="form-control" required value="{% if logistics %}{{ logistics.customer_phone }}{% endif %}">
                        </div>
                        <div class="col-12">
                            <label for="to_address" class="form-label">{{ content.cms_delivery_address|default:'Delivery Address *' }}</label>
                            <textarea name="to_address" id="to_address" class="form-control" rows="3" required>{% if logistics %}{{ logistics.to_address }}{% endif %}</textarea>
                        </div>
                        <div class="col-md-4">
                            <label for="delivery_date" class="form-label">{{ content.cms_expected_delivery_date|default:'Expected Delivery Date' }}</label>
                            <input type="date" name="delivery_date" id="delivery_date" class="form-control" value="{% if logistics and logistics.delivery_date %}{{ logistics.delivery_date|date:'Y-m-d' }}{% endif %}">
                        </div>
                        <div class="col-md-4">
                            <label for="driver_name" class="form-label">{{ content.cms_driver_name|default:'Driver Name' }}</label>
                            <input type="text" name="driver_name" id="driver_name" class="form-control" value="{% if logistics %}{{ logistics.driver_name }}{% endif %}">
                        </div>
                        <div class="col-md-4">
                            <label for="vehicle_number" class="form-label">{{ content.cms_vehicle_number|default:'Vehicle Number' }}</label>
                            <input type="text" name="vehicle_number" id="vehicle_number" class="form-control" value="{% if logistics %}{{ logistics.vehicle_number }}{% endif %}">
                        </div>
                        <div class="col-md-6">
                            <label for="delivery_cost" class="form-label">{{ content.cms_delivery_cost|default:'Delivery Cost' }}</label>
                            <input type="number" name="delivery_cost" id="delivery_cost" class="form-control" step="0.01" value="{% if logistics %}{{ logistics.delivery_cost|floatformat:2 }}{% else %}0.00{% endif %}">
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">{{ content.cms_notes|default:'Notes' }}</label>
                            <textarea name="notes" id="notes" class="form-control" rows="2">{% if logistics %}{{ logistics.notes }}{% endif %}</textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg me-1"></i>{{ content.cms_save_logistics|default:'Save Logistics' }}</button>
                            <a href="{% url 'logistics_list' %}" class="btn btn-secondary">{{ content.cms_cancel|default:'Cancel' }}</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
