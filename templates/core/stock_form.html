{% extends 'base.html' %}

{% block title %}{{ action }} Stock - SaasApp{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{{ action }} Stock</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">{{ content.cms_branch|default:'Branch *' }}</label>
                    <select name="branch" class="form-select" required>
                        <option value="">{{ content.cms_select_branch|default:'Select Branch' }}</option>
                        {% for branch in branches %}
                        <option value="{{ branch.pk }}">{{ branch.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ content.cms_product|default:'Product *' }}</label>
                    <select name="product" class="form-select" required>
                        <option value="">{{ content.cms_select_product|default:'Select Product' }}</option>
                        {% for product in products %}
                        <option value="{{ product.pk }}">{{ product.name }} ({{ product.sku }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ content.cms_date_added|default:'Date Added *' }}</label>
                    <input type="date" name="date_added" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ content.cms_quantity|default:'Quantity *' }}</label>
                    <input type="number" name="quantity" class="form-control" value="0" min="0.01" step="0.01" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ content.cms_minimum_quantity|default:'Minimum Quantity' }}</label>
                    <input type="number" name="min_quantity" class="form-control" value="10" min="0" step="0.01">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">{{ content.cms_save_stock|default:'Save Stock' }}</button>
                <a href="{% url 'stock_list' %}" class="btn btn-secondary">{{ content.cms_cancel|default:'Cancel' }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// No auto-date setting - user will input manually
</script>
{% endblock %}
