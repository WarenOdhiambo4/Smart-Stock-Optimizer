{% extends 'base.html' %}

{% block title %}{{ action }} Order - SaasApp{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{{ action }} Order</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" id="orderForm">
            {% csrf_token %}
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">{{ content.cms_branch|default:'Branch *' }}</label>
                    <select name="branch" class="form-select" required>
                        <option value="">{{ content.cms_select_branch|default:'Select Branch' }}</option>
                        {% for branch in branches %}
                        <option value="{{ branch.pk }}">{{ branch.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ content.cms_order_date|default:'Order Date *' }}</label>
                    <input type="date" name="order_date" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ content.cms_supplier|default:'Supplier' }}</label>
                    <input type="text" name="supplier" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">{{ content.cms_delivery_charges_kes|default:'Delivery Charges (KES)' }}</label>
                    <input type="number" name="delivery_charges" step="0.01" class="form-control" placeholder="0.00" min="0">
                </div>
                <div class="col-md-8">
                    <label class="form-label">{{ content.cms_notes|default:'Notes' }}</label>
                    <input type="text" name="notes" class="form-control">
                </div>
            </div>

            <h6 class="mb-3">{{ content.cms_order_items|default:'Order Items' }}</h6>
            <div id="orderItems">
                <div class="row g-2 mb-2 order-item">
                    <div class="col-md-3">
                        <input type="text" name="product_name" class="form-control form-control-sm" placeholder="Product Name" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" name="product_sku" class="form-control form-control-sm" placeholder="SKU">
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="quantity" class="form-control form-control-sm" placeholder="Qty" value="1" min="0.01" step="0.01" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="unit_price" step="0.01" class="form-control form-control-sm" placeholder="Price" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control form-control-sm line-total" placeholder="Total" readonly>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-outline-danger btn-sm remove-item"><i class="bi bi-trash"></i></button>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="addItem">
                <i class="bi bi-plus me-1"></i>{{ content.cms_add_item|default:'Add Item' }}</button>

            <div class="row g-2 align-items-center mt-3">
                <div class="col-md-8"></div>
                <div class="col-md-2 text-end">
                    <label class="form-label mb-0">{{ content.cms_order_total|default:'Total Amount' }}</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="orderTotal" class="form-control form-control-sm" readonly value="0.00">
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">{{ content.cms_create_order|default:'Create Order' }}</button>
                <a href="{% url 'order_list' %}" class="btn btn-secondary">{{ content.cms_cancel|default:'Cancel' }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('addItem').addEventListener('click', function() {
    const template = document.querySelector('.order-item').cloneNode(true);
    template.querySelectorAll('input').forEach(input => {
        if (input.name === 'quantity') {
            input.value = '1';
        } else if (input.classList.contains('line-total')) {
            input.value = '';
        } else {
            input.value = '';
        }
    });
    document.getElementById('orderItems').appendChild(template);
    updateOrderTotals();
});

document.getElementById('orderItems').addEventListener('click', function(e) {
    if (e.target.closest('.remove-item')) {
        const items = document.querySelectorAll('.order-item');
        if (items.length > 1) {
            e.target.closest('.order-item').remove();
            updateOrderTotals();
        }
    }
});

document.getElementById('orderItems').addEventListener('input', function(e) {
    if (e.target.name === 'quantity' || e.target.name === 'unit_price') {
        updateOrderTotals();
    }
});

function updateOrderTotals() {
    let total = 0;
    document.querySelectorAll('.order-item').forEach(row => {
        const qty = parseFloat(row.querySelector('input[name="quantity"]').value) || 0;
        const price = parseFloat(row.querySelector('input[name="unit_price"]').value) || 0;
        const lineTotal = qty * price;
        const lineTotalField = row.querySelector('.line-total');
        if (lineTotalField) {
            lineTotalField.value = lineTotal ? lineTotal.toFixed(2) : '';
        }
        total += lineTotal;
    });
    document.getElementById('orderTotal').value = total.toFixed(2);
}

updateOrderTotals();
</script>
{% endblock %}
