{% extends 'base.html' %}

{% block title %}Report Broken Product{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{{ content.cms_report_broken_product|default:'Report Broken Product' }}</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6">
                <label class="form-label">{{ content.cms_stock_item|default:'Stock Item' }}</label>
                <select name="stock" class="form-select" required>
                    <option value="">{{ content.cms_select_stock|default:'Select stock...' }}</option>
                    {% for stock in stocks %}
                    <option value="{{ stock.id }}" {% if selected_stock_id == stock.id %}selected{% endif %}>
                        {{ stock.product.name }} | {{ stock.branch.name }} | Qty: {{ stock.quantity }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">{{ content.cms_quantity|default:'Quantity' }}</label>
                <input type="number" name="quantity" class="form-control" min="0.01" step="0.01" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">{{ content.cms_damage_type|default:'Damage Type' }}</label>
                <select name="damage_type" class="form-select" required>
                    {% for value, label in damage_types %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">{{ content.cms_description|default:'Description' }}</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Notes about the damage..."></textarea>
            </div>
            <div class="col-12 d-flex justify-content-end gap-2">
                <a href="{% url 'broken_products_list' %}" class="btn btn-outline-secondary">{{ content.cms_cancel|default:'Cancel' }}</a>
                <button type="submit" class="btn btn-primary">{{ content.cms_report|default:'Report' }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
